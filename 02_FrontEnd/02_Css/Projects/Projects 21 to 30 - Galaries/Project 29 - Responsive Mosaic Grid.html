<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project 29 – Responsive Mosaic Grid (No JS)</title>

  <style>
    /* ============================================================
       Project 29 – Responsive Mosaic Grid
       ------------------------------------------------------------
       • No JavaScript. Pure CSS Grid + transitions.
       • Top glassy menu bar with pill links.
       • Auto-fit masonry-like grid using responsive "cards".
       • Mosaic feel: selected items span extra rows/cols at ≥ 900px.
       • Hover/focus: image de-saturate → color + subtle zoom,
         caption slides up with gradient readability.
       • Fully keyboard accessible via :focus-visible.
       ============================================================ */

    :root{
      --bg: #0f172a;            /* slate-900 */
      --ink: #e5e7eb;           /* slate-200 */
      --muted: #9aa2b2;         /* cool gray for copy */
      --accent: #22d3ee;        /* cyan-400 */
      --accent-ink: #061015;
      --tile-bg: #0b1222;       /* deep navy card */
      --ring: 0 0 0 3px rgba(34,211,238,.55), 0 0 0 7px rgba(34,211,238,.18);
      --radius: 14px;
      --shadow: 0 14px 32px rgba(0,0,0,.35);
      --gap: 12px;              /* grid gap */
      --maxw: 1200px;
    }

    /* ===== Base ===== */
    html, body { margin:0; }
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 10% -10%, #1e293b 0%, #0f172a 55%), #0f172a;
      color: var(--ink);
      line-height: 1.6;
    }

    /* ===== Top Navigation (glassy bar) ===== */
    .nav{
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      background: rgba(2,6,23,.6);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .nav-inner{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: .85rem 1rem;
      display: flex; align-items: center; justify-content: space-between; gap:.75rem;
    }
    .brand{
      font-weight: 800; letter-spacing:.3px;
      color: var(--accent);
    }
    .menu{
      display:flex; gap:.4rem; flex-wrap: wrap;
    }
    .menu a{
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      padding:.45rem .8rem;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 999px;
      background: linear-gradient(to bottom right, rgba(255,255,255,.06), rgba(255,255,255,.02));
      transition: transform .15s ease, background .2s ease, color .2s ease;
    }
    .menu a:hover{ transform: translateY(-2px); color: var(--accent); }

    /* ===== Header ===== */
    header{
      max-width: var(--maxw);
      margin: 1.2rem auto 0;
      padding: 1rem;
    }
    header h1{ margin:.2rem 0 .35rem; font-size: clamp(1.6rem, 3.5vw, 2.2rem); }
    header p{ margin:0; color: var(--muted); }

    /* ===== Mosaic Grid =====
       We use auto-fit + minmax to create flexible tiles that
       break to 1, 2, 3, 4 columns depending on viewport. */
    .grid{
      max-width: var(--maxw);
      margin: 1rem auto 2.2rem;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--gap);
    }

    /* Tile (card) container */
    .tile{
      position: relative;
      background: var(--tile-bg);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      isolation: isolate;       /* new stacking context for overlay */
    }

    /* Image fills width; aspect is controlled by actual image dimensions.
       To unify height feel, we can also clamp with aspect-ratio if desired:
       .tile img { aspect-ratio: 4/3; object-fit: cover; } */
    .tile img{
      display:block;
      width: 100%;
      height: auto;
      filter: grayscale(.35) contrast(1.02);
      transform: scale(1);
      transition: transform .6s ease, filter .6s ease;
      z-index: 1;
      position: relative;
    }

    /* Caption overlay (hidden by default) */
    .caption{
      position: absolute; inset: auto 0 0 0;
      padding: .9rem 1rem 1rem;
      color: #ffffff;
      background:
        linear-gradient(to top, rgba(2,6,23,.78) 0%, rgba(2,6,23,.45) 45%, rgba(2,6,23,0) 100%);
      transform: translateY(16px);
      opacity: 0;
      transition: opacity .35s ease, transform .35s ease;
      z-index: 2;
      pointer-events: none; /* clicks go through to <a> if added */
    }
    .caption h3{
      margin: 0 0 .15rem; font-size: 1rem; letter-spacing:.2px;
    }
    .caption p{ margin: 0; font-size: .92rem; opacity: .95; }

    /* Hover/focus reveal */
    .tile:hover img,
    .tile:focus-within img{
      transform: scale(1.04);
      filter: grayscale(0) saturate(1.08) contrast(1.06);
    }
    .tile:hover .caption,
    .tile:focus-within .caption{
      opacity: 1;
      transform: translateY(0);
    }

    /* Invisible link to enable keyboard focus (optional) */
    .coverlink{
      position: absolute; inset: 0;
    }
    .coverlink:focus-visible{
      outline: none;
      box-shadow: var(--ring);
      border-radius: 10px;
      margin: 6px; /* keep ring visible inside rounded corners */
    }

    /* ===== Mosaic Accents (bigger spans on wide screens) =====
       On large viewports, make a few tiles span to create rhythm.
       These selectors are deterministic (by order in markup). */
    @media (min-width: 900px){
      .tile:nth-of-type(3){ grid-column: span 2; }
      .tile:nth-of-type(7){ grid-row: span 2; }
      .tile:nth-of-type(10){ grid-column: span 2; }
      .tile:nth-of-type(14){ grid-row: span 2; }
      .tile:nth-of-type(18){ grid-column: span 2; }
      .tile:nth-of-type(21){ grid-row: span 2; }
      /* Ensure images still look good when spanned */
      .tile:nth-of-type(7) img,
      .tile:nth-of-type(14) img,
      .tile:nth-of-type(21) img{
        height: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
      }
    }

    /* ===== Print (optional clean output) ===== */
    @media print{
      .nav, header{ display:none !important; }
      body{ background: #fff; color: #000; }
      .tile{ break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
      .caption{ background: none; color: #000; opacity: 1; transform:none; }
    }
  </style>
